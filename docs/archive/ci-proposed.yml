# HISTORICAL CI DESIGN — saved 2026-10-15. The current workflow differs;
# this file is retained for audit history, not as a deployable workflow.

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test command center
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Build and unit-test frontend
        run: |
          npm ci --prefix frontend-react
          npm run build --prefix frontend-react
          npm test --prefix frontend-react
      - name: Test engine and API contracts
        run: python -m pytest tests/ -q
      - name: Browser smoke tests
        working-directory: frontend-react
        run: |
          npx playwright install --with-deps chromium
          cd ..
          python -m uvicorn autonoc.api.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('API did not become ready')
          PY
          npm run test:e2e --prefix frontend-react
      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend-react/test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy to Fly.io
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
