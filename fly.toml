# fly.toml app configuration file for autonoc-project

app = "autonoc-project"
primary_region = "ams"

[env]
  AUTONOC_DATA_DIR = "/data"
  # Browser sessions. These are the API defaults; they are pinned here so the
  # deployed limits are visible in the repository next to the machine size they
  # were chosen for (1 shared CPU / 1024 MB). Only /api/* traffic takes a slot,
  # idle dashboards expire, and quiet ones are reclaimed, so a full registry
  # cannot lock visitors out. See docs/archive/SESSION_CAPACITY_FIX.md.
  AUTONOC_MAX_SESSIONS = "16"
  AUTONOC_SESSION_IDLE_SECONDS = "180"
  AUTONOC_SESSION_RECLAIM_GRACE = "15"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# SQLite contains completed aggregate summaries only, never live engine state.
# Fly provisions the small persistent volume on first deploy if it is absent.
[[mounts]]
  source = "autonoc_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
