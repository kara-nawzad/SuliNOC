<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081426" />
    <title>SuliNOC · Network operations</title>
    <link rel="preload" as="image" href="/assets/hero-city-sunset.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/manrope-latin-500-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/ibm-plex-mono-latin-500-normal.woff2"
    />
    <style>
      @font-face {
        font-family: Manrope;
        src: url("/assets/fonts/manrope-latin-400-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Manrope;
        src: url("/assets/fonts/manrope-latin-500-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("/assets/fonts/ibm-plex-mono-latin-500-normal.woff2")
          format("woff2");
        font-style: normal;
        font-weight: 500;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        font-family: Manrope, sans-serif;
        background: #081426;
        color: #f6f8fc;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #081426;
      }
      button {
        font: inherit;
      }
      #hero {
        position: relative;
        display: grid;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        isolation: isolate;
        background: #081426;
        transition:
          opacity 280ms ease,
          visibility 280ms ease;
      }
      #hero.off {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }
      .hero-background {
        position: absolute;
        z-index: -3;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 56%;
        pointer-events: none;
        user-select: none;
      }
      .hero-topbar {
        position: absolute;
        z-index: 1;
        top: max(28px, env(safe-area-inset-top));
        left: clamp(24px, 5vw, 76px);
        right: clamp(24px, 5vw, 76px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        animation: appear 700ms 100ms both;
      }
      .hero-logo {
        display: block;
        width: 176px;
        height: 67px;
        flex: 0 0 auto;
        object-fit: contain;
        object-position: left center;
        filter: brightness(0) invert(1);
      }
      .hero-copy {
        position: absolute;
        z-index: 1;
        top: 27%;
        left: clamp(24px, 5.8vw, 90px);
        width: min(720px, calc(100vw - 48px));
        animation: appear 850ms 180ms both;
      }
      h1 {
        max-width: 700px;
        margin: 0;
        font-family: Manrope, sans-serif;
        font-size: clamp(48px, 5vw, 76px);
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -0.045em;
        text-wrap: balance;
        text-shadow: 0 1px 3px rgb(5 15 31 / 38%);
      }
      .hero-highlight {
        display: block;
        color: #52d3e7;
        font-synthesis: weight;
        font-weight: 700;
      }
      .lede {
        max-width: 480px;
        margin: 18px 0 0;
        color: rgb(246 248 252 / 94%);
        font-size: clamp(14px, 1.35vw, 17px);
        line-height: 1.55;
        text-shadow: 0 1px 3px rgb(5 15 31 / 42%);
      }
      .hero-features {
        display: grid;
        max-width: 470px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 25px 0 0;
        padding: 0;
        list-style: none;
      }
      .hero-feature {
        display: flex;
        min-width: 0;
        min-height: 54px;
        align-items: center;
        gap: 9px;
        padding: 9px 12px;
      }
      .hero-feature:first-child {
        padding-left: 0;
      }
      .hero-feature + .hero-feature {
        border-left: 1px solid rgb(246 248 252 / 22%);
      }
      .hero-feature svg {
        width: 25px;
        height: 25px;
        flex: 0 0 25px;
        fill: none;
        color: #52d3e7;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }
      .hero-feature span {
        max-width: 92px;
        color: rgb(246 248 252 / 90%);
        font-size: 11px;
        line-height: 1.35;
      }
      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 21px;
      }
      .hero-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 20px;
        border: 1px solid transparent;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition:
          transform 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease;
      }
      .hero-button:hover {
        transform: translateY(-2px);
      }
      .hero-button:focus-visible {
        outline: 2px solid #a8eee2;
        outline-offset: 3px;
      }
      #enter {
        color: #081426;
        background: #fff;
      }
      #enter:hover {
        background: #fff;
      }
      #enter svg {
        width: 16px;
        height: 16px;
        transition: transform 180ms ease;
      }
      #enter:hover svg {
        transform: translateX(3px);
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 700px) {
        .hero-background {
          object-position: 74% center;
        }
        .hero-topbar {
          top: max(16px, env(safe-area-inset-top));
          left: 20px;
          right: 20px;
          gap: 12px;
        }
        .hero-logo {
          width: 156px;
          height: 60px;
        }
        .hero-copy {
          top: auto;
          bottom: max(26px, env(safe-area-inset-bottom));
          left: 20px;
          width: calc(100vw - 40px);
        }
        h1 {
          max-width: 560px;
          font-size: clamp(38px, 10vw, 58px);
        }
        .lede {
          max-width: 420px;
          margin-top: 14px;
          font-size: 14px;
          line-height: 1.5;
        }
        .hero-features {
          max-width: 500px;
          margin-top: 20px;
        }
        .hero-feature {
          min-height: 48px;
          gap: 7px;
          padding: 8px;
        }
        .hero-feature svg {
          width: 21px;
          height: 21px;
          flex-basis: 21px;
        }
        .hero-feature span {
          font-size: 10px;
        }
        .hero-actions {
          gap: 9px;
          margin-top: 18px;
        }
        .hero-button {
          min-height: 46px;
          padding: 0 15px;
        }
      }
      @media (max-width: 420px) {
        .hero-topbar {
          justify-content: flex-start;
        }
      }
      @media (max-width: 380px) {
        .hero-features {
          grid-template-columns: 1fr;
          gap: 2px;
          margin-top: 14px;
          border-top: 0;
        }
        .hero-feature {
          min-height: 30px;
          gap: 8px;
          padding: 4px 0;
        }
        .hero-feature + .hero-feature {
          border-left: 0;
        }
        .hero-feature svg {
          width: 20px;
          height: 20px;
          flex-basis: 20px;
        }
        .hero-feature span {
          max-width: none;
          font-size: 11px;
        }
        .hero-actions {
          margin-top: 14px;
        }
      }
      @media (max-height: 560px) and (min-width: 701px) {
        .hero-copy {
          top: auto;
          bottom: 18px;
        }
        h1 {
          font-size: clamp(36px, 7vh, 56px);
        }
        .lede {
          margin-top: 9px;
          line-height: 1.4;
        }
        .hero-features {
          margin-top: 12px;
        }
        .hero-feature {
          min-height: 42px;
          gap: 7px;
          padding: 6px 9px;
        }
        .hero-feature svg {
          width: 21px;
          height: 21px;
          flex-basis: 21px;
        }
        .hero-feature span {
          font-size: 10px;
        }
        .hero-actions {
          margin-top: 12px;
        }
        .hero-button {
          min-height: 42px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="hero" aria-labelledby="hero-title">
      <img
        class="hero-background"
        src="/assets/hero-city-sunset.png"
        alt=""
        fetchpriority="high"
      />
      <header class="hero-topbar">
        <img
          class="hero-logo"
          src="/assets/suli-noc-logo-dark.png"
          alt="SuliNOC"
          fetchpriority="high"
        />
      </header>
      <section class="hero-copy">
        <h1 id="hero-title">
          See your network
          <span class="hero-highlight">before it breaks.</span>
        </h1>
        <p class="lede">
          AI-powered telecom operations for a more connected Sulaymaniyah.
        </p>
        <ul class="hero-features" aria-label="SuliNOC capabilities">
          <li class="hero-feature">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <circle cx="12" cy="12" r="4.5" />
              <path d="m12 12 4-4M12 2.5v2M21.5 12h-2M12 21.5v-2M2.5 12h2" />
            </svg>
            <span>Real-time monitoring</span>
          </li>
          <li class="hero-feature">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 5.2a3 3 0 0 0-5.7 1.3A3.4 3.4 0 0 0 5 13a3.1 3.1 0 0 0 3 5.2H12z"
              />
              <path
                d="M12 5.2a3 3 0 0 1 5.7 1.3A3.4 3.4 0 0 1 19 13a3.1 3.1 0 0 1-3 5.2H12"
              />
              <path
                d="M8.5 9.5c1.4 0 1.8.8 1.8 1.7M8.1 14.5c1.2 0 2.2.6 2.2 1.7m5-6.7c-1.4 0-1.8.8-1.8 1.7m2.2 3.3c-1.2 0-2.2.6-2.2 1.7"
              />
            </svg>
            <span>AI-powered insights</span>
          </li>
          <li class="hero-feature">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3 19.5 6v5c0 4.7-3 8-7.5 10-4.5-2-7.5-5.3-7.5-10V6z"
              />
              <path d="m9 12 2 2 4-4" />
            </svg>
            <span>Fewer outages, more uptime</span>
          </li>
        </ul>
        <div class="hero-actions">
          <button class="hero-button" id="enter" type="button">
            Enter workspace
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M4.75 12h14.5m-6-6 6 6-6 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </section>
    </main>
    <script>
      document.addEventListener(
        "click",
        (event) => {
          const target =
            event.target instanceof Element
              ? event.target.closest("#enter")
              : null;
          if (!target) return;
          event.preventDefault();
          window.parent.postMessage(
            { type: "sulinoc:enter" },
            window.location.origin,
          );
        },
        true,
      );
    </script>
  </body>
</html>
