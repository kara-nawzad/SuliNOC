.aisw{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ai);white-space:nowrap;cursor:pointer}
.aisw input{accent-color:#6A4BD8;width:30px;height:16px;margin:0}
.aisw input:disabled{opacity:.45}
#c-more{display:none}
@media(max-width:900px){
 #c-more{display:inline-block}
 .simctl .opt{display:none}
 .simctl.open #c-menu{display:flex;flex-direction:column;gap:8px;position:absolute;top:40px;right:0;background:var(--s1);border:1px solid var(--ln);padding:10px;z-index:30;min-width:170px}
 .simctl.open .opt{display:inline-flex}
 .simctl.open #c-menu .ctlbtn{text-align:left}
}
#dlg{position:fixed;inset:0;background:#10265C66;display:grid;place-items:center;z-index:60}
#dlg[hidden]{display:none}
.dlgbox{background:var(--s2);border:1px solid var(--ln);border-radius:4px;padding:18px 20px;width:min(480px,92vw)}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dlgbox h3{margin:0;font:500 18px Newsreader,Georgia,serif}
#toast.err{border-left:3px solid var(--crit)}
#simctl .ctl:focus-visible,.aisw:focus-within{outline:2px solid var(--live);outline-offset:2px}

/* ---- group 2 layout fixes and group 3 inspector ---- */
#main{grid-column:2;grid-row:2}
#bar>*{flex:none}
#bar .bwm{font-size:18px;white-space:nowrap}
#bar>.ctxs{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar input{flex:1 1 140px;min-width:140px;max-width:240px;width:auto}
#bar>span[style]{min-width:0}
#clk2{white-space:nowrap}
#clk2 .lng{display:none}
@media(min-width:1560px){#clk2 .lng{display:inline}}
@media(max-width:1099px){#bar .ico .lbl{display:none}#bar .ico{padding:4px 9px}}
@media(min-width:900px) and (max-width:1100px){#app{--sw:56px}#side button{font-size:0;gap:0;justify-content:center}#side .wm{display:none}}
#simctl .mclk{display:none}
.ctlbtn .ic{font-size:13px;line-height:1}
.aisw{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 6px;background:none;border:0;border-radius:4px;color:var(--tx);font-size:12px;cursor:pointer;white-space:nowrap}
.aisw .trk{position:relative;width:34px;height:18px;border-radius:9px;background:#C9D9EC;flex:none;transition:background .2s}
.aisw .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #10265C44;transition:transform .2s}
.aisw[aria-checked=true] .trk{background:#6A4BD8}
.aisw[aria-checked=true] .knob{transform:translateX(16px)}
.aisw .st{color:var(--t2)}
.aisw[aria-checked=true] .st{color:#6A4BD8;font-weight:500}
.aisw[aria-busy=true] .knob{opacity:.5}
.aisw[aria-busy=true] .knob::after{content:'';position:absolute;left:-4px;top:-4px;width:18px;height:18px;border-radius:50%;border:1.5px solid transparent;border-top-color:#10265C;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.aisw:focus-visible{outline:none}
.aisw:focus-visible .trk{outline:2px solid var(--live);outline-offset:2px}
@media(max-width:1099px){.aisw .st{display:none}}
.simctl.open .aisw .st{display:inline}
.simctl.open .lbl{display:inline}
/* tabs and sheets */
#tabs{display:none}
#more[hidden]{display:none}
/* inspector: desktop drawer */
#ap{position:fixed;top:48px}
.grab{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx);margin:6px 12px 0 0}
.tag::before{content:'';width:3px;height:14px;background:var(--c,var(--t2))}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.kvs b{display:block;font-weight:400;font-size:14px;overflow-wrap:anywhere}
.gauges{display:grid;gap:12px}
.gauge{display:grid;gap:4px}
.gauge .gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--t2)}
.gauge .gv{font-family:var(--m);font-size:22px;font-weight:500;text-align:right}
.gbar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden}
.gbar i{display:block;height:100%}
.gs{font-size:12px;color:var(--t2)}
.simrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.simrow select{min-height:44px;padding:0 8px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:4px;max-width:100%}
.cta{min-height:44px;padding:0 16px;border:1px solid var(--tx);border-radius:4px;background:transparent;color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.cta:hover{background:var(--s2)}
.cta:disabled{opacity:.45;cursor:not-allowed}
.cta[aria-busy=true]{opacity:.7;cursor:progress}
.cta.arm{background:#D42F52;border-color:#D42F52;color:#fff}
.cta:focus-visible,.btn:focus-visible,#tabs button:focus-visible,.morelist button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.dots{font-size:20px;line-height:1}
@media(max-width:899px){
 #side{display:none}
 #app{--sw:0px}
 #tg{display:none}
 #main{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
 body.ws #tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
 #tabs button{min-height:56px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;background:none;border:0;border-top:2px solid transparent;color:var(--t2);font:inherit;font-size:11px;line-height:1.15;text-align:center;cursor:pointer}
 #tabs button.on{color:var(--tx);border-top-color:var(--live)}
 #tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
 #tabs button:focus-visible{outline-offset:-4px}
 #more{position:fixed;inset:0;z-index:50}
 #moreback{position:absolute;inset:0;background:#10265C66}
 #more .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border-radius:14px 14px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto}
 #more h3{font:500 18px Newsreader,Georgia,serif;margin:6px 0 8px}
 .morelist{display:grid;gap:2px}
 .morelist button{display:flex;gap:12px;align-items:center;min-height:48px;padding:10px 6px;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--tx);font:inherit;font-size:16px;text-align:left;cursor:pointer}
 .morelist svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
 .grab{display:flex;height:28px;align-items:center;justify-content:center;cursor:grab;touch-action:none}
 .grab::before{content:'';width:44px;height:5px;border-radius:3px;background:var(--t2)}
 #ap{top:auto;left:0;right:0;bottom:0;width:auto;height:75vh;max-height:75vh;border-left:0;border-top:1px solid var(--ln);border-radius:14px 14px 0 0;transform:translateY(105%);padding:4px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:45;box-shadow:0 -8px 30px #10265C22}
 #ap.open{transform:none}
 #ap #ins-head{position:sticky;top:-4px;z-index:2;background:inherit}
 #ap .gauge .gv{font-size:24px}
 #ap .kvs{grid-template-columns:1fr}
}
@media(max-width:419px){#bar{gap:6px;padding:0 8px}#bar .bwm{font-size:16px}#simctl{gap:4px}#simctl .ctlbtn{padding:4px 8px}}
@media(max-width:599px){
 #clk2{display:none}
 .simctl.open #c-menu .mclk{display:block}
}

/* ===== group 3 fixes ===== */
@font-face{font-family:'Manrope';font-weight:300;font-display:swap;src:local('Manrope')}
#q{flex:0 1 220px;width:220px;min-width:140px}
@media(min-width:1101px){#bar .bwm{display:none}#bar>.ctxs{flex:0 0 auto;overflow:visible}}
@media(max-width:1100px){#bar>.ctxs{display:none}}
@media(max-width:1399px){#bar .ctxx{display:none}}
/* van crew marker: beacon blinks; static when paused or reduced motion; parked vans have no cone or beacon */
.bcn{animation:bcn .7s steps(2) infinite}@keyframes bcn{to{opacity:.2}}
body.sim-paused .bcn,html.rm .bcn{animation:none}
@media (prefers-reduced-motion:reduce){.bcn{animation:none}}
.van.parked .cone,.van.parked .bcn{display:none}
/* maps: links drawn only for the selection; fibre rings at ~15% */
.map:not(#hm) .lk{opacity:.15}
.map:not(#hm).hassel .lk{opacity:0}
.map:not(#hm).hassel .lk.sl{opacity:1}
.map:not(#hm).dim .lk{opacity:0}
.map:not(#hm).dim .lk.hl{opacity:1}
.map:not(#hm).ringsel .lk{opacity:.06}
.map:not(#hm).ringsel .lk.rs{opacity:1;stroke-width:2}
.map:not(#hm).ringsel .nd:not(.rn){opacity:.35}
.map:not(#hm) .nl{display:none;font:600 7.5px var(--m);fill:var(--tx);stroke:#fff;stroke-width:2.2;paint-order:stroke;pointer-events:none}
.map:not(#hm).zm .nl{display:block}
.map:not(#hm) .nd .halo{animation:none!important}
.map:not(#hm) .nd.warn .halo,.map:not(#hm) .nd.crit .halo,.map:not(#hm) .nd.ai .halo,.map:not(#hm) .nd.sel .halo,.map:not(#hm) .nd:hover .halo{animation:hb 3.4s ease-in-out infinite!important}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;max-width:100%}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
/* inspector gauges: good/warn/bad bands and current-value marker */
.gbar{position:relative}
.gbar .gband{position:absolute;top:0;bottom:0}
.gbar>i:not(.gband){position:relative;z-index:1}
.gbar .gmk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--tx);border-radius:1px;z-index:2}
/* phone: opaque sheet, sheet clears the tab bar, tab bar above the sheet */
@media(max-width:899px){
 body.ws #tabs{z-index:46}
 body.ws #ap{background:#F6FAFF;padding-bottom:calc(73px + env(safe-area-inset-bottom,0px))}
}

function applyBackend(d){

 const names=d.agg.map(a=>a.name);D=names;
 const ix={};
 T=d.nodes.map((n,i)=>{ix[n.id]=i;const p=PROJ(n.lat,n.lon);return{id:i,n:n.id,d:names[n.agg],x:Math.round(p.x),y:Math.round(p.y),st:n.status==0?'ok':n.status>=4?'crit':'warn',tp:n.status?((CFG.status_names||{})[n.status]||'Alarm'):'',ai:0,rsrp:Math.round(n.rsrp),sinr:Math.round(n.sinr),prb:Math.round(n.prb),drop:+n.loss.toFixed(2),temp:Math.round(n.temp),batt:Math.round(n.battery),thr:n.throughput,raw:n}});
 const seen=new Set();L=[];
 d.rings.forEach((r,ri)=>{const ids=r.nodes.map(x=>ix[x]).filter(x=>x!=null);if(ids.length<2)return;ids.forEach((a,k)=>{const b=ids[(k+1)%ids.length];if(a===b)return;const key=Math.min(a,b)+'-'+Math.max(a,b);if(!seen.has(key)){seen.add(key);L.push([a,b,r.id??ri])}})});

 TEAMS=d.teams.map(t=>({...t,p:PROJ(t.lat,t.lon)}));
 const tm=CFG.tick_minutes||5;
 const list=d.dashboard.incidents.map(i=>{const k=ix[i.node_id];if(k==null)return null;return{id:i.id,t:T[k],a:ACK[i.id]||0,at:minHM(i.since_tick*tm),cat:i.title,sev:i.severity=='CRITICAL'?'crit':'warn',detail:i.detail}}).filter(Boolean);
 inc=list;
 if(!SEEN.size)evs=[];
 list.forEach(i=>{if(!SEEN.has(i.id)){SEEN.add(i.id);evs.unshift(`<div>${i.at} ${i.cat} <span class="t2">${i.t.n} · ${i.detail}</span></div>`)}});
 evs.length=Math.min(evs.length,12);
 Object.keys(ACK).forEach(k=>{if(!list.some(i=>i.id==k))delete ACK[k]});
}
function hms(ms){return new Date(ms).toTimeString().slice(0,8)}

}

async function pollOnce(){
 if(INFLIGHT||document.hidden)return;INFLIGHT=true;
 try{
  if(!CFG){CFG=await request('/api/config');PROJ=mkProj()}

/* API client, ported from frontend/src/api.js */
const SESSION_KEY='suli-noc-session',SESSION_HEADER='X-AutoNOC-Session',RETRY_HEADER='X-AutoNOC-Retry',CAPACITY_CODE='session_capacity';
async function send(path,init={}){const timeout=AbortSignal.timeout(15000);const signal=init.signal?AbortSignal.any([init.signal,timeout]):timeout;const token=sessionStorage.getItem(SESSION_KEY);const headers={...(init.headers??{}),...(token?{[SESSION_HEADER]:token}:{})};const r=await fetch(path,{...init,headers,signal,cache:'no-store'});const issued=r.headers.get(SESSION_HEADER);if(issued)sessionStorage.setItem(SESSION_KEY,issued);return r}
async function request(path,init={}){let r=await send(path,init);let body=await r.json().catch(()=>null);if(r.status===503&&body?.code===CAPACITY_CODE){const hinted=Number(r.headers.get('Retry-After'));const wait=Number.isFinite(hinted)?Math.min(Math.max(hinted,0)*1000,1500):1000;await new Promise(x=>setTimeout(x,wait));r=await send(path,{...init,headers:{...(init.headers??{}),[RETRY_HEADER]:'1'}});body=await r.json().catch(()=>null)}if(!r.ok){if(body?.code===CAPACITY_CODE)throw new Error('SuliNOC is at capacity. Close an idle dashboard tab and try again.');throw new Error(typeof body?.detail==='string'?body.detail:`Request failed (${r.status})`)}if(body===null)throw new Error('The server returned an invalid response.');return body}
async function control(path,params={}){if(!RUN)throw new Error('No simulation run yet. Waiting for the backend.');const q=new URLSearchParams(Object.entries({...params,run_id:RUN}).map(([k,v])=>[k,String(v)]));const res=await request(`/api/control/${path}?${q}`,{method:'POST'});if(res.ok===false||typeof res.error==='string')throw new Error(res.reason||res.error||'The engine rejected this action.');if(CTL){if((path==='pause'||path==='resume')&&typeof res.paused==='boolean')CTL={...CTL,paused:res.paused};if(path==='speed'&&typeof res.speed==='number')CTL={...CTL,speed:res.speed}}return res}
/* controls: pending state, then the backend's answer. Nothing is shown as done before the backend confirms. */
async function act(key,fn,okMsg,onErr){
 if(FAIL>0||!CTL)return;if(BUSY[key]){toast('Still working on the previous change…');return}BUSY[key]=1;
 const els=()=>document.querySelectorAll(`[data-k="${key}"]`);
 els().forEach(e=>{e.setAttribute('aria-busy','true');e.disabled=true});
 try{const r=await fn();toast(okMsg(r))}
 catch(e){toast(e.message,true);if(onErr)onErr()}
 finally{BUSY[key]=0;els().forEach(e=>{e.removeAttribute('aria-busy');e.disabled=FAIL>0});updateChrome();pollOnce()}
}
