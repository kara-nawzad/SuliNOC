name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test command center
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-py312.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Test engine and API contracts
        id: python-tests
        continue-on-error: true
        run: python -m pytest tests/ -q --junitxml=python-test-results.xml
      - name: Report Python test failures
        if: steps.python-tests.outcome == 'failure'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("python-test-results.xml").getroot()
          for case in root.iter("testcase"):
              issue = case.find("failure")
              if issue is None:
                  issue = case.find("error")
              if issue is None:
                  continue
              message = " ".join((issue.get("message") or issue.text or "").split())
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest failure::{case.get('name')}: {message[:3000]}")
          PY
          exit 1
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend formatting
        run: npm run format:check --prefix frontend
      - name: Test frontend unit suite
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Install Chromium for Playwright smoke
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test welcome assets and Esri map status/retry
        run: npm run test:e2e -- e2e/map-status.spec.ts --reporter=github
        working-directory: frontend
      - name: Preserve Playwright failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Fly.io
    needs: test
    # Deploy only from main after the suite passes. Pull requests and forks
    # must never touch the public demo.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Prepare persistent summary volume and one primary machine
        run: |
          set -euo pipefail
          volumes="$(flyctl volumes list --app autonoc-project --json)"
          if ! jq -e 'any(.[]; .name == "autonoc_data" and .region == "ams" and .state != "destroyed")' <<< "$volumes" >/dev/null; then
            flyctl volumes create autonoc_data --app autonoc-project --region ams --size 1 --yes
          fi
          flyctl scale count app=1 --region ams --yes
          machines="$(flyctl machines list --app autonoc-project --json)"
          keep_id="$(jq -r '[.[] | select(.region == "ams" and .state == "started")][0].id // empty' <<< "$machines")"
          if [[ -z "$keep_id" ]]; then
            echo "No started simulation machine found in primary region ams." >&2
            exit 1
          fi
          while IFS= read -r machine_id; do
            [[ -z "$machine_id" ]] && continue
            echo "Removing extra machine $machine_id before deploy (keeping $keep_id in ams)."
            flyctl machines destroy "$machine_id" --app autonoc-project --force
          done < <(jq -r --arg keep "$keep_id" '.[] | select(.id != $keep) | .id' <<< "$machines")
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy app
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Keep one primary-region simulation machine
        run: |
          set -euo pipefail
          flyctl scale count app=1 --region ams --yes
          machines="$(flyctl machines list --app autonoc-project --json)"
          keep_id="$(jq -r '[.[] | select(.region == "ams" and .state == "started")][0].id // empty' <<< "$machines")"
          if [[ -z "$keep_id" ]]; then
            echo "No started simulation machine found in primary region ams." >&2
            exit 1
          fi
          while IFS= read -r machine_id; do
            [[ -z "$machine_id" ]] && continue
            echo "Removing extra simulation machine $machine_id (keeping $keep_id in ams)."
            flyctl machines destroy "$machine_id" --app autonoc-project --force
          done < <(jq -r --arg keep "$keep_id" '.[] | select(.id != $keep) | .id' <<< "$machines")
          remaining="$(flyctl machines list --app autonoc-project --json)"
          count="$(jq '[.[] | select(.state != "destroyed")] | length' <<< "$remaining")"
          if [[ "$count" -ne 1 ]] || [[ "$(jq -r '.[0].region' <<< "$remaining")" != "ams" ]]; then
            echo "Expected exactly one simulation machine in ams; post-deploy Fly state did not converge." >&2
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
